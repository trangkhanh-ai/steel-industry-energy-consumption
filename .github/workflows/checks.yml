name: Source and forecasting checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.check_repository
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.audit_features_and_leakage
      - run: python -m scripts.audit_features_and_leakage --processed-dir reports/steel/duy_2026-10-02/processed
      - run: python -m scripts.check_duy_handoff --run-dir reports/steel/duy_2026-10-02
      - run: python -m scripts.check_steel_demo_environment
      - run: python -m scripts.check_probabilistic_run --run-dir reports/steel/release_2026-10-14 --output-file outputs/ci_probabilistic_verification.json

  notebooks:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-notebooks.txt
      - run: python -m scripts.run_notebooks --output-dir outputs/ci_notebooks
